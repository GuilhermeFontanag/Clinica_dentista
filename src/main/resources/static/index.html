<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Cadastro - Clínica Odontológica Sorriso Claro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%230284c7%22><path d=%22M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-9c.83 0 1.5-.67 1.5-1.5S7.83 8 7 8s-1.5.67-1.5 1.5S6.17 11 7 11zm10 0c.83 0 1.5-.67 1.5-1.5S17.83 8 17 8s-1.5.67-1.5 1.5.67 1.5 1.5 1.5zm-5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z%22/></svg>">
</head>
<body class="auth-page">

  <div class="auth-container">
    <!-- Header do Card -->
    <header class="auth-header">
      <div style="display:flex; justify-content:center; margin-bottom:0.5rem;">
        <svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1>Sorriso Claro</h1>
      <p>Sistema Integrado de Gestão Odontológica</p>
    </header>

    <!-- Abas de Navegação -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab-btn active" id="tab-btn-login" onclick="switchAuthTab('login')">
        Acessar Perfil
      </button>
      <button type="button" class="auth-tab-btn" id="tab-btn-register" onclick="switchAuthTab('register')">
        Criar Novo Usuário
      </button>
    </div>

    <!-- Conteúdo da Aba 1: Login Sem Validação -->
    <div class="auth-body" id="tab-login">
      <p style="margin-bottom:1.25rem; font-size:0.92rem; text-align:center;">
        Selecione o seu perfil para entrar diretamente no sistema:
      </p>

      <form id="form-login" onsubmit="handleLoginSubmit(event)">
        <div class="role-selector">
          <label class="role-option">
            <input type="radio" name="login_role" value="paciente" checked>
            <div class="role-card">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span>Paciente</span>
            </div>
          </label>

          <label class="role-option">
            <input type="radio" name="login_role" value="dentista">
            <div class="role-card">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
              </svg>
              <span>Dentista</span>
            </div>
          </label>

          <label class="role-option">
            <input type="radio" name="login_role" value="recepcionista">
            <div class="role-card">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
              </svg>
              <span>Recepção</span>
            </div>
          </label>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-name">Nome de Identificação (Opcional)</label>
          <input type="text" id="login-name" class="form-control" placeholder="Ex: Mariana Silva ou Dr. Roberto">
          <small class="form-help">Se deixar em branco, usaremos o perfil padrão da função.</small>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
          Entrar no Sistema
        </button>
      </form>
    </div>

    <!-- Conteúdo da Aba 2: Criar Novo Usuário -->
    <div class="auth-body" id="tab-register" style="display:none;">
      <p style="margin-bottom:1.25rem; font-size:0.92rem; text-align:center;">
        Selecione o tipo de usuário que deseja cadastrar na API:
      </p>

      <div class="role-selector" style="margin-bottom:1.25rem;">
        <label class="role-option">
          <input type="radio" name="register_role" value="paciente" checked onchange="updateRegisterFormFields()">
          <div class="role-card">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span>Paciente</span>
          </div>
        </label>

        <label class="role-option">
          <input type="radio" name="register_role" value="dentista" onchange="updateRegisterFormFields()">
          <div class="role-card">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
            <span>Dentista</span>
          </div>
        </label>

        <label class="role-option">
          <input type="radio" name="register_role" value="recepcionista" onchange="updateRegisterFormFields()">
          <div class="role-card">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg>
            <span>Recepção</span>
          </div>
        </label>
      </div>

      <!-- Container do Formulário Dinâmico de Cadastro -->
      <form id="form-register" onsubmit="handleRegisterSubmit(event)">
        <div id="dynamic-register-fields">
          <!-- Injetado via JavaScript de acordo com o papel escolhido -->
        </div>

        <div id="register-feedback" style="margin-top:1rem;"></div>

        <button type="submit" id="btn-submit-register" class="btn btn-primary" style="width:100%; margin-top:0.75rem;">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
          Cadastrar Usuário na API
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
